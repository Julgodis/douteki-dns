# Example configuration for douteki-dns
# Copy to config.toml and fill in the secrets before running.
user_agent = "douteki-dns/0.1"
# check_interval_seconds = 120 # optional override; must be less than record TTLs

[ip_sources.ipv4]
type = "http"
url = "https://api.ipify.org"

[ip_sources.ipv6]
type = "http"
url = "https://api64.ipify.org"

[provider]
type = "glesys"
api_user = "cl12345"
api_key = "superSecret"
update_endpoint = "https://api.glesys.com/domain/updaterecord"
add_endpoint = "https://api.glesys.com/domain/addrecord"
list_endpoint = "https://api.glesys.com/domain/listrecords"

[[provider.records]]
# record_id is optional; omit it to create the record when missing
record_id = "abcdef123456"
domain = "example.com"
hostname = "home"
record_type = "A"
ttl = 300

[[provider.records]]
domain = "example.com"
hostname = "home"
record_type = "AAAA"
ttl = 300
